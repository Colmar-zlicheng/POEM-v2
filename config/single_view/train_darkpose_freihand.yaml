DATASET:
  TRAIN:
    TYPE: FreiHAND_v2_Extra
    DATA_MODE: "2D"
    DATA_ROOT: "data"
    SPLIT_MODE: "full"
    DATA_SPLIT: "train"
    N_VIEWS: 5
    USE_GT_FROM_MULTIVIEW: True
    USE_LEFT_HAND: False
    MASTER_SYSTEM: as_constant_camera
    CONST_CAM_ID: 2

    TRANSFORM:
      TYPE: SimpleTransform2D
      AUG: True
      CENTER_JIT: 0.05
      SCALE_JIT: 0.06
      ROT_JIT: 10
      COLOR_JIT: 0.3
      ROT_PROB: 0.1
      OCCLUSION: False

  TEST:
    TYPE: FreiHAND_v2_Extra
    DATA_MODE: "2D"
    DATA_ROOT: "data"
    SPLIT_MODE: "full"
    DATA_SPLIT: "test"
    N_VIEWS: 5
    USE_LEFT_HAND: False
    TEST_WITH_MULTIVIEW: True
    MASTER_SYSTEM: as_constant_camera
    CONST_CAM_ID: 2

    TRANSFORM:
      TYPE: SimpleTransform2D
      AUG: False

DATA_PRESET:
  USE_CACHE: True
  BBOX_EXPAND_RATIO: 2.0
  IMAGE_SIZE: [256, 256]
  HEATMAP_SIZE: [64, 64]
  CENTER_IDX: 0
  NUM_JOINTS: 21
  WITH_HEATMAP: True
  WITH_MASK: False

MODEL:
  TYPE: DarkPose_ResNet
  PRETRAINED: null
  BACKBONE:
    TYPE: ResNet101
    PRETRAINED: True
    FREEZE_BATCHNORM: True
  INPLANES: 2048
  EXTRA:
    FINAL_CONV_KERNEL: 1
    DECONV_WITH_BIAS: false
    NUM_DECONV_LAYERS: 3
    NUM_DECONV_FILTERS:
    - 256
    - 256
    - 256
    NUM_DECONV_KERNELS:
    - 4
    - 4
    - 4
    NUM_LAYERS: 101
  NUM_JOINTS: 21

TRAIN:
  MANUAL_SEED: 1
  CONV_REPEATABLE: True
  BATCH_SIZE: 4
  EPOCH: 101
  OPTIMIZER: adam
  LR: 0.0001
  SCHEDULER: StepLR
  LR_DECAY_STEP: [50]
  LR_DECAY_GAMMA: 0.1
  WEIGHT_DECAY: 0.0
  FIND_UNUSED_PARAMETERS: False
  LOG_INTERVAL: 10
  GRAD_CLIP_ENABLED: True
  GRAD_CLIP:
    NORM: 1.0
    TYPE: 2